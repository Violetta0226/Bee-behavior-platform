services:

  proxy:
    image: traefik:v3.7
    ports:
      - "80:80"
      - "8090:8080"
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --accesslog
      - --log
      - --log.level=DEBUG
      - --api
      - --api.insecure=true

  db:
    ports:
      - "5432:5432"

  adminer:
    ports:
      - "8080:8080"

  backend:
    ports:
      - "8000:8000"

    build:
      context: .
      dockerfile: backend/Dockerfile

    command:
      - fastapi
      - dev
      - --host
      - "0.0.0.0"

    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv

        - path: ./backend/pyproject.toml
          action: rebuild

        - path: ./frontend
          action: rebuild
          ignore:
            - ./frontend/node_modules
            - ./frontend/dist
            - ./frontend/blob-report
            - ./frontend/test-results

    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
      - ./data/uploads/videos:/app/uploads/videos

    environment:
      FASTAPI_ENV: "development"
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - NODE_ENV=production

    ipc: host

    depends_on:
      - backend
      - mailcatcher

    environment:
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      - PLAYWRIGHT_BASE_URL=http://backend:8000
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI:-}

    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results

    ports:
      - "9323:9323"
